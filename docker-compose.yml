services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urgent_medicine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/urgent_medicine
      FRONTEND_ORIGIN: http://localhost:3000
      SESSION_COOKIE_NAME: urgent_medicine_session
      SESSION_TTL_DAYS: 7
      DELIVERY_CHARGE_BDT: 220
      AUTH_PEPPER: change-this-in-local-only
      VERIFICATION_PROVIDER: console
      COOKIE_SAME_SITE: lax
      CSRF_COOKIE_NAME: urgent_medicine_csrf
      PRIVATE_UPLOAD_DIR: /app/storage/private
      PAYMENT_PROVIDER: sslcommerz
      SSLCOMMERZ_SANDBOX: "true"
      SSLCOMMERZ_STORE_ID: "local"
      SSLCOMMERZ_STORE_PASSWORD: "local"
      PAYMENT_PUBLIC_BASE_URL: http://localhost:4000
      OCL_BASE_URL: https://tr.ocl.dghs.gov.bd
      OCL_COLLECTION_PATH: /orgs/MoHFW/collections/dgda-registered-drugs-valueset/
      OCL_PAGE_SIZE: 250
      CATALOG_MAX_RECORDS: 100000
      MIGRATIONS_DIR: /app/database/migrations
      APP_VERSION: local-compose
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    volumes:
      - prescription_private:/app/storage/private

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  prescription_private:
